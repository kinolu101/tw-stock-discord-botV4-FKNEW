
name: TW Stock Discord Bot V4 SHORT

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 08:50 = UTC 00:50
    - cron: "50 0 * * 1-5"

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Taipei
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
      SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
      SHIOAJI_SIMULATION: ${{ secrets.SHIOAJI_SIMULATION }}

      MIN_CHANGE_RATE: "-5.0"
      MAX_CHANGE_RATE: "-1.0"
      MIN_VOLUME: "3000"
      MIN_TURNOVER_TWD: "300000000"
      TOP_N: "3"
      TOP_PRINT_N: "20"
      CANDIDATES_FILE: "candidates_0900.json"
      BREAKOUTS_FILE: "breakouts_0905.json"
      TWSE_HOLIDAYS: ${{ vars.TWSE_HOLIDAYS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait until 09:00 Taiwan time
        shell: bash
        run: |
          target=$(TZ=Asia/Taipei date -d "09:00:00" +%s)
          now=$(TZ=Asia/Taipei date +%s)
          if [ "$now" -lt "$target" ]; then
            sleep $((target - now))
          fi

      - name: Run 09:00 short candidates
        run: python run_0900_v4.py

      - name: Wait until 09:05 Taiwan time
        shell: bash
        run: |
          target=$(TZ=Asia/Taipei date -d "09:05:10" +%s)
          now=$(TZ=Asia/Taipei date +%s)
          if [ "$now" -lt "$target" ]; then
            sleep $((target - now))
          fi

      - name: Run 09:05 short confirmation
        run: python run_0905_v4.py

      - name: Wait until 09:10 Taiwan time
        shell: bash
        run: |
          target=$(TZ=Asia/Taipei date -d "09:10:10" +%s)
          now=$(TZ=Asia/Taipei date +%s)
          if [ "$now" -lt "$target" ]; then
            sleep $((target - now))
          fi

      - name: Run 09:10 rebound failure
        run: python run_0910_v4.py

      - name: Upload result json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw-stock-short-results
          path: |
            candidates_0900.json
            breakouts_0905.json
            short_signals_0910.json
          if-no-files-found: ignore
